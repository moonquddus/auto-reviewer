# Copy to config.yaml and edit.

# true: log the review that would be posted, post nothing.
dry_run: true

# true: skip PRs with failed CI, and wait for pending CI.
check_ci: true

# Seconds between checks for PRs to review.
poll_seconds: 120

# Only review PRs by these authors. Set at least one of the two.
allow:
  authors: []          # e.g. [alice, bob]
  teams: []            # e.g. [my-org/backend]

max_diff_bytes: 200000

# How Claude must review. Paths are relative to this repo, or absolute.
review_guide: review-guide.md
repo_guides: {}        # e.g. {my-org/api: guides/api.md}

claude:
  # login: use the account from `claude /login`.
  # token: use a `claude setup-token` token stored in the macOS Keychain:
  #   security add-generic-password -a "$USER" -s auto-reviewer-claude-token -w <token>
  auth: login
  token_keychain_service: auto-reviewer-claude-token
  model: sonnet
  timeout_seconds: 600

# Optional. Gives Claude the Jira tickets that a PR links to, so it can check the intent.
# Leave base_url empty to turn it off. Store an API token from
# https://id.atlassian.com/manage-profile/security/api-tokens in the macOS Keychain:
#   security add-generic-password -a "$USER" -s auto-reviewer-jira-token -w <token>
jira:
  base_url: ""         # e.g. https://my-org.atlassian.net
  email: ""            # your Atlassian account email
  token_keychain_service: auto-reviewer-jira-token
